name: LibraryClub CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: src/LibraryClub.slnx
  API_PROJECT_PATH: src/LibraryClub.Api/LibraryClub.Api.csproj
  TEST_PROJECT_PATH: src/LibraryClub.Tests/LibraryClub.Tests.csproj
  PUBLISH_DIR: ./publish

jobs:
  ci:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --filter "Category=Unit"

      - name: Run integration tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --filter "Category=Integration"

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}