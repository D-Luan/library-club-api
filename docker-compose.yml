services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libraryclub-sqlserver
    environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    ports:
        - $"{SQLSERVER_PORT}:1433"
    volumes:
        - libraryclub_sqlserver_data:/var/opt/mssql

volumes:
  libraryclub_sqlserver_data: